<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS DOM Manipulation</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./index.js"></script>
  </head>
  <body class="container">
    <h1 class="fs-2 fw-bold">JS DOM Manipulation</h1>

    <!-- Create and destroy a DOM element -->
    <section class="container">
      <h2 class="fs-3">Create and destroy a DOM element</h2>
      <button id="btnCreate">create</button>
      <button id="btnDestroy">destroy</button>
      <div id="create-destroy" class="container"></div>
    </section>

    <!-- Show and hide a DOM element -->
    <section class="container">
      <h2 class="fs-3">Show and hide a DOM element</h2>
      <div class="container">
        <h4>Show and hide buttons</h4>
        <button id="btnShow">show</button>
        <button id="btnHide">hide</button>
        <div id="hide-show" class="container">
          <img
            width="400"
            src="https://m.media-amazon.com/images/I/71d-A8MgTnL._SL1500_.jpg"
            alt="Now you see me film poster"
          />
        </div>
      </div>
      <div class="container">
        <h4>Show and hide toggle</h4>
        <button id="btnToggleShow">toggle show</button>
        <div id="hide-show-toggle" class="container" hidden>
          <img
            width="400"
            src="https://m.media-amazon.com/images/M/MV5BYjhlNDljNTgtZjc4My00NmZmLTk2YzAtYWE5MDYwYjM4MTkzXkEyXkFqcGdeQXVyODE5NzE3OTE@._V1_.jpg"
            alt="Now you see me 2 film poster"
          />
        </div>
      </div>
    </section>

    <!-- Set interval -->
    <section class="container">
      <p id="question">Start Quiz</p>
    </section>
  </body>
</html>
